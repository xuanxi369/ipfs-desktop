[package]
name = "ipfs-desktop-rust"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ipfs_desktop_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[dependencies]
# Tauri 核心
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（IPFS API）
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 错误处理
anyhow = "1"
thiserror = "1"

# 自动启动
auto-launch = "0.6"

# 工具
dirs = "5"
which = "6"
chrono = "0.4"
open = "5"
futures-util = "0.3"
# 流式文件上传（分块读取，避免整文件驻留内存）
tokio-util = { version = "0.7", features = ["io"] }
# 查询参数百分号编码
urlencoding = "2"

# SQLite 缓存
rusqlite = { version = "0.31", features = ["bundled"] }

# Phase 4: Backend trait
async-trait = "0.1"

# Phase 4: iroh 原生后端（optional feature）
# 注意：iroh 1.0 起 blobs/docs 已拆为独立 crate；本机原生 add/cat 走 iroh-blobs 的 FsStore。
iroh = { version = "1", optional = true }
iroh-blobs = { version = "0.103", optional = true, features = ["fs-store"] }

[features]
# 启用后编译 iroh_adapter.rs 的真实实现（node_info / add_file / cat）。
iroh-backend = ["dep:iroh", "dep:iroh-blobs"]

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

