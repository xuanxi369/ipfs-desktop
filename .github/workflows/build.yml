name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. 前端 TypeScript 类型检查 (快速, 先跑)
  # ════════════════════════════════════════════════════════════
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  # ════════════════════════════════════════════════════════════
  # 2. Rust 编译 + 单元测试 (矩阵: linux/macos/windows)
  # ════════════════════════════════════════════════════════════
  build-and-test:
    needs: frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      # ── Linux: 安装系统依赖 ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libssl-dev

      # ── macOS: 无需额外依赖 ──
      # ── Windows: 无需额外依赖 ──

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Rust 编译检查 (debug mode, 更快)
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Rust 单元测试
      - name: Cargo test (unit)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # ════════════════════════════════════════════════════════════
  # 3. Rust 代码质量检查 (仅 Linux, 快速)
  # ════════════════════════════════════════════════════════════
  lint:
    needs: frontend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libssl-dev

      - name: Rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ════════════════════════════════════════════════════════════
  # 4. Tauri 打包 (仅 tag push — 矩阵: linux/macos/windows)
  # ════════════════════════════════════════════════════════════
  tauri-build:
    needs: [build-and-test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Tauri 完整构建 (前端 + Rust + 打包)
      - name: Tauri build
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*

  # ════════════════════════════════════════════════════════════
  # 5. 创建 GitHub Release (仅 tag push)
  # ════════════════════════════════════════════════════════════
  create-release:
    needs: tauri-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Display bundle structure
        run: find bundles -type f | head -50

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IPFS Desktop Rust ${{ github.ref_name }}"
          draft: true
          generate_release_notes: true
          files: bundles/**/*
